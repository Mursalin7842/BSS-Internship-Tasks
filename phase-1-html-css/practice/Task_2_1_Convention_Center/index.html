<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="stylesheet" href="style.css">
    <title>Convention Center</title>
</head>
<body>

    <header class="header">
        <div class="logo">
            <p>Abacus Convention Center</p>
        </div>
        <nav class="nav-bar">
            <ul class="nav-list">
                <li><a href="#">Home</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">Subscribe</a></li>
            </ul>
        </nav>

    </header>

    <main class="main-container">

        <div class="hero">
            
            <div class="slider">
                    <img src="images/leftslide.png" alt="Left Slide">

                    <img src="images/rightslide.png" alt="right Slide">
            </div>

            <div class ="banner-text">
                <div class="banner-text-big">
                    <p>The perfect venue for your next event</p>
                </div>
                <div class="banner-text-small">
                    <p>Amet minim mollit non deserunt ullamco est sit aliqua dolor do amet sint. Velit officia consequat duis enim velit</p>
                </div>
                <button class="btn">Book Now</button>
            </div>
            
            <div class="slider_indicator">
                <img src="images/hero_bottom_bar.png" alt="slider indicator">
            </div>

        </div>
        
        <div class="packages">

        </div>

        <div class="clients-review">

        </div>

        <div class="QA">

        </div>
    </main>    
    
    <footer class="footer">

    </footer>

</body>
</html>
