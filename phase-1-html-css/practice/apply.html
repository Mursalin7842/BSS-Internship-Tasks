<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Apply</title>
    </head>
    <body>
        <h1>Apply</h1>
        <p>Fill out the form below to apply for our program.</p>

        <form action="/submit-application" method="post">
        <section>
            <h2>Personal Details</h2>
           
            <label for ="position">Position Applying For:</label><br>
            <select id="position" name="position" required>
                <option value="">Select a position</option>
                <option value="developer">Business Development Executive / Trainee</option>
                <option value="designer">Senior Software Engineer (.NET)</option>
                <option value="manager">AI Engineer Junior/Intern</option>
            </select>
            <br>
            <br>
            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required><br><br>
            
            <label for="phone">Phone Number:</label><br>
            <input type="tel" id ="phone" name="phone" placeholder="+880"required>
            <br><br>
            
            <label for ="dob">Date of Birth:</label><br>
            <input type="date" id ="dob" name="dob" required><br><br>

            <label for ="address">Address:</label><br>
            <textarea id="address" name="address" rows="5" required></textarea><br><br>

            <label for="gender">Gender:</label><br>
            <label for="gender">
            <input type ="radio" id="gender" name="gender" value="male" required>Male</label>
            <label for="gender">
            <input type ="radio" id="gender" name="gender" value="female" required>Female</label>
            <label for="gender">
            <input type ="radio" id="gender" name="gender" value="other" required>Other</label><br><br>

            <label for="resume">Upload Resume:</label><br>
            <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required><br><br>

            <input type="submit" value="Submit Application">
            </section>
        </form>
    </body>
</html>
