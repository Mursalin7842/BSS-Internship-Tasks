<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/favicon.png">
    <title>Bono App | Sign Up</title>
</head>
<body>
    <div class="wrapper">
        <header class="header">
            <a href="index.html">
                <img class="logo" src="images\logo.svg" alt="logo">
            </a>
            <div class="header-right">
                <div>
                    <i class="fas fa-envelope"></i> mursalin7842@gmail.com
                </div>
                <div>
                    <i class="fas fa-phone"></i> (+880) 1876-002634
                </div>
                <a href="#">
                    <i class="fa-brands fa-twitter"></i>
                </a>
            </div>
        </header>

        <main class="main-content">
            <form>
                <div class="form-group">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Your Message</label>
                        <textarea id="message" name="message" required></textarea>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn">Submit</button>
                    </div>
                </div>
            </form>

            <div class="text-container">
                <h1>Coming Soon For Every Developer</h1>
                <p>Our new Bono webb app will change the way you think about content
                    management and will allow you to focus on what really important.
                    Use the contact form to send us your thoughts.
                </p>
            </div>
        </main>
        <footer>
            <div class="back-home-screen">
                <li><button class="footer-btn"> <a href="../index.html">Home</a></button></li>
                <li><button class="footer-btn"><a
                            href="https://github.com/Mursalin7842/BSS-Internship-Tasks/blob/102cda52648e9bb3bfb8192509acf4f679984ad2/phase-1-html-css/practice/module9">Source
                            code</a></button></li>
            </div>
        </footer>
    </div>
</body>
</html>
