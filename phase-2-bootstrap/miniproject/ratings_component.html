<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="styles/ratings.css">
    <title>Ratings Component</title>
</head>

<body>

    <div class="container">
        <div class="card bg-light border-0 shadow-lg mt-5 rounded-4">
            <div class="card-body">
                <div class="row p-5"> <!--top row-->
                    <div class="col-7">
                        <h2 class="fw-bold">What others think about the product</h2>
                    </div>
                    <div class="col-5">
                        <div class="card">
                            <div class="card-body">
                                <h3 class="display-5 fw-semibold">
                                    <i class="fas fa-star text-warning"></i>4.8
                                </h3>
                                <p class="text-center">Average Rating</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!---search section-->

                <div class="row px-5">
                    <div class="col-12">
                        <div class="input-group input-group-lg">
                            <span class="input-group-text rounded-start-5">
                                <i class="fas fa-search"></i>
                            </span>
                            <input type="text" class="form-control rounded-end-5"
                                placeholder="Search for reviews" />
                        </div>
                    </div>
                </div>

                <!--ratings section-->

                <div class="row p-5">
                    <div class="col-12 vstack gap-2">
                        <h5>Reviews</h5>
                        <div class="d-flex align-items-center gap-1">
                            <span>5</span><i class="fas fa-star text-warning"></i>
                            <div class="progress ms-3"
                            style="height: 10px; width:100%">
                                <div class="progress-bar bg-warning" style="width: 80%"></div>
                            </div>
                        </div>

                        <div class="d-flex align-items-center gap-1">
                            <span>4</span><i class="fas fa-star text-warning"></i>
                            <div class="progress ms-3" style="height: 10px; width:100%">
                                <div class="progress-bar bg-warning" style="width: 60%"></div>
                            </div>
                        </div>

                        <div class="d-flex align-items-center gap-1">
                            <span>3</span><i class="fas fa-star text-warning"></i>
                            <div class="progress ms-3" style="height: 10px; width:100%">
                                <div class="progress-bar bg-warning" style="width: 20%"></div>
                            </div>
                        </div>

                        <div class="d-flex align-items-center gap-1">
                            <span>2</span><i class="fas fa-star text-warning"></i>
                            <div class="progress ms-3" style="height: 10px; width:100%">
                                <div class="progress-bar bg-warning" style="width: 10%"></div>
                            </div>
                        </div>

                        <div class="d-flex align-items-center gap-1">
                            <span>1</span><i class="fas fa-star text-warning"></i>
                            <div class="progress ms-3" style="height: 10px; width:100%">
                                <div class="progress-bar bg-warning" style="width: 30%"></div>
                            </div>
                        </div>
                    </div>
                </div>


                <div class="row px-5 pb-4">
                    <div class="col-12">
                        <a href="#" class="btn btn-success btn-lg rounded-5">Write Review</a>
                    </div>
                </div>

            </div>
        </div>

                <div class="btn-group hstack gap-4 my-5 shadow-lg">
                    <a href="../index.html" class="btn btn-dark ">Back to Home</a>
                    <a href="https://github.com/Mursalin7842/BSS-Internship-Tasks/blob/main/phase-2-bootstrap/miniproject"
                        class="btn btn-warning">Source Code</a>
                </div>
    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
