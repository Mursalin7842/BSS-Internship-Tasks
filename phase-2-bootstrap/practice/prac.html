<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Mursaline</title>
</head>
<body>
    
    <!--accordions-->

    <div class="accordion m-5" id="holla">
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button 
                class="accordion-button"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#meacc"
                >Mursaline</button>
            </h2>

            <div class="accordion-collapse collapse" id="meacc" data-bs-parent="#holla">
                <div class="accordion-body">
                    hello how are you
                </div>
            </div>
            <h2 class="accordion-header">
                <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#meacc2">Mursaline</button>
            </h2>
            
            <div class="accordion-collapse collapse" id="meacc2" data-bs-parent="#holla">
                <div class="accordion-body">
                    hello how are you
                </div>
            </div>
        </div>
    </div>

    <!--carousel-->
    <div class="container my-5 px-5">
        <div class="carousel slide" id="slider">
            <div class="carousel-inner ">

                <div class="carousel-indicators">
                    <button class="active" data-bs-slide-to="0"
                    data-bs-target="#slider"></button>
                    <button data-bs-slide-to="1"
                    data-bs-target="#slider"></button>
                    <button data-bs-slide-to="2"
                    data-bs-target="#slider"></button>
                </div>

                <div class="carousel-item active ">
                    <img src="https://nyc.cloud.appwrite.io/v1/storage/buckets/68d6ef860005042c623e/files/6a63c36c003289b23145/view?project=68d66de0003533b5c70f" class="d-block w-100">
                </div>

                <div class="carousel-item">
                    <img src="https://nyc.cloud.appwrite.io/v1/storage/buckets/68d6ef860005042c623e/files/6a63b5780011ef13a17d/view?project=68d66de0003533b5c70f" class="d-block w-100">
                </div>

                <div class="carousel-item">
                    <img src="https://nyc.cloud.appwrite.io/v1/storage/buckets/68d6ef860005042c623e/files/68d89d28001d89a46bae/view?project=68d66de0003533b5c70f" class="d-block w-100">
                </div>
            </div>

            <!---buttons prev next-->

            <button class="carousel-control-prev"
            data-bs-slide="prev"
            data-bs-target="#slider">
                <span class="carousel-control-prev-icon bg-danger rounded-5 "></span>
            </button>

            <button class="carousel-control-next"
            data-bs-slide="next"
            data-bs-target="#slider">
                <span class="carousel-control-next-icon bg-danger rounded-5"></span>
            </button>

            
        </div>

        <button class="btn btn-primary mt-5" type="button"
        id="poppy"
        data-bs-toggle="popover"
        data-bs-title="Mursaline Huqe"
        data-bs-content="Hello hi bye"
        >
            <span class="spinner-border spinner-border-sm"></span> Loading...
        </button>

        <button class="btn btn-primary mt-5 mx-5"
        type="button"
        data-bs-toggle="modal"
        data-bs-target="#mymodal"
        >Click me</button>

        <div class="modal" id="mymodal">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title">Modal Title</h1>
                        <button class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Fugit perspiciatis numquam tempore porro hic harum incidunt minus natus delectus omnis.</p>
        
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                        <button class="btn btn-success">Save changes</button>
                    </div>
                </div>
            </div>
        </div>


    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const popovereli = document.getElementById("poppy");
        const popi = new bootstrap.Popover(popovereli);
    </script>
</body>
</html>
