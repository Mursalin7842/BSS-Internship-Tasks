<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Display & Positioning</title>
</head>
<body>
    <h1>Display & Positioning</h1>
    <div class="container">
        <p class="display-1">Display Section</p>

        <p class="d-md-none">This paragraph is hidden in medium to large screens and only shown below medium screens. using class <strong>"d-md-none"</strong>. and completely hidden will be "d-none"</p>

        <div class="d-inline">Converts block-level elements to inline elements, using class <strong>"d-inline"</strong>. </div>

    </div>

</body>
</html>
